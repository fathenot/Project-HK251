
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_supermarket
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: supermarket_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mysql_net

networks:
  mysql_net:

volumes:
  mysql_data:
